<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>후쿠오카 여행 일정 11/21~23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6ec; --card:#fffdf8; --ink:#3b2f25; --sub:#8a7663; --line:#eadfcd;
  --accent:#e2725b; --accent-soft:#fbe3dc; --move:#eef4ea; --move-ink:#4f6b43;
  --star:#fff1c9; --done:#c8bba9;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
header{padding:22px 18px 10px;max-width:760px;margin:0 auto}
h1{font-family:'Gowun Dodum',sans-serif;font-size:1.65rem;margin:0 0 2px}
.subtitle{color:var(--sub);font-size:.95rem}
.sticky{position:sticky;top:0;z-index:10;background:var(--bg);padding:8px 14px 10px;border-bottom:1px solid var(--line)}
.sticky-in{max-width:760px;margin:0 auto}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 12px}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;border:0;outline:0;background:transparent;font-size:1.05rem;color:var(--ink);font-family:inherit}
.search button{border:0;background:none;font-size:1.2rem;color:var(--sub);cursor:pointer;display:none}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.tab{flex:1;min-width:92px;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;font-family:inherit;font-size:.95rem;color:var(--ink);cursor:pointer;text-align:center;line-height:1.3}
.tab b{display:block;font-size:1.05rem}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .today{font-size:.72rem;background:#fff;color:var(--accent);border-radius:6px;padding:0 5px;margin-left:3px}
main{max-width:760px;margin:0 auto;padding:14px 14px 80px}
.hotel{background:var(--accent-soft);border-radius:16px;padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hotel .t{font-weight:800}
.hotel .a{font-size:.9rem;color:var(--sub)}
.day-head{font-family:'Gowun Dodum',sans-serif;font-size:1.3rem;margin:6px 0 12px;line-height:1.4}
.progress{font-size:.9rem;color:var(--sub);margin:-6px 0 14px}
.stop{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:0 2px 0 rgba(120,90,60,.05)}
.stop.top{border:2px solid #f0c75e;background:linear-gradient(var(--star),var(--card) 60px)}
.stop.sub{background:transparent;border:2px dashed var(--line);box-shadow:none}
.tag{display:inline-block;font-size:.75rem;font-weight:800;color:#fff;background:var(--accent);border-radius:6px;padding:0 7px;margin-left:4px;vertical-align:1px}
.tag-sub{background:#fff;color:var(--sub);border:1px solid var(--line);font-weight:600}
.filter{display:flex;gap:6px;margin:-6px 0 12px}
.stop.done{opacity:.55}
.stop.done .title{text-decoration:line-through;text-decoration-color:var(--done)}
.row1{display:flex;align-items:flex-start;gap:10px}
.time{font-weight:800;color:var(--accent);font-size:.95rem;white-space:nowrap}
.title{font-weight:800;font-size:1.12rem;line-height:1.4;flex:1}
.chk{width:28px;height:28px;flex:none;border:2px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;color:#fff}
.done .chk{background:var(--move-ink);border-color:var(--move-ink)}
.move{background:var(--move);color:var(--move-ink);border-radius:12px;padding:8px 12px;margin:10px 0;font-size:.95rem}
ul.notes{margin:8px 0 0;padding-left:20px}
ul.notes li{margin:4px 0}
.place{border-top:1px dashed var(--line);margin-top:10px;padding-top:10px}
.place .pn{font-weight:600}
.place .addr{font-size:.92rem;color:var(--sub);word-break:break-all}
.place .pd{font-size:.95rem}
.btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 11px;font-size:.88rem;font-family:inherit;color:var(--ink);text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn.map{border-color:#9cc3e6;color:#2c5d8a}
.btn.taxi{border-color:#f0c75e;color:#8a6410}
mark{background:#ffe48a;color:inherit;border-radius:3px;padding:0 1px}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.result-day{font-size:.85rem;color:#fff;background:var(--sub);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:3px 11px;font-size:.85rem;color:var(--sub);cursor:pointer;font-family:inherit}
/* taxi overlay */
#overlay{position:fixed;inset:0;background:#fffdf8;z-index:50;display:none;flex-direction:column;justify-content:center;align-items:center;padding:24px;text-align:center}
#overlay.on{display:flex}
#ov-ask{font-size:1.25rem;color:var(--sub);margin-bottom:18px}
#ov-name{font-size:1.9rem;font-weight:800;margin-bottom:14px;line-height:1.35}
#ov-addr{font-size:2.1rem;font-weight:800;line-height:1.4;word-break:break-all}
#ov-close{margin-top:34px;font-size:1.1rem;padding:12px 28px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 18px;border-radius:20px;font-size:.95rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin:-4px 0 8px}
.bar div{height:100%;background:var(--move-ink);border-radius:8px;transition:width .3s}
.sec-h{font-weight:800;font-size:1.1rem;margin:18px 0 6px}
.done-h{margin-top:28px;color:var(--sub);border-top:2px dashed var(--line);padding-top:16px}
.cat-h{font-weight:600;color:var(--accent);margin:14px 0 6px;font-size:.98rem}
.cat-h span{background:var(--accent-soft);border-radius:8px;padding:0 7px;font-size:.85rem}
.ci{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.ci.v{background:transparent;opacity:.6}
.ci.v .ci-n{text-decoration:line-through;text-decoration-color:var(--done)}
.vchk{width:32px;height:32px;flex:none;border:2px solid var(--line);border-radius:50%;background:#fff;cursor:pointer;font-size:1.05rem;color:#fff;display:flex;align-items:center;justify-content:center}
.ci.v .vchk{background:var(--move-ink);border-color:var(--move-ink)}
.ci-body{flex:1;min-width:0}
.ci-n{font-weight:600;line-height:1.4}
.ci-d{font-size:.88rem;color:var(--sub)}
.ci-cat{font-size:.78rem;color:var(--sub)}
.ci-map{flex:none;padding:6px 9px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:18px;font-size:.95rem;color:var(--sub)}

/* ---- v3 compact UI ---- */
html,body{font-size:17px}
header{padding:18px 16px 6px}
h1{font-size:1.45rem}
.subtitle{font-size:.88rem}
.tab{padding:7px 4px;font-size:.82rem;min-width:70px}
.tab b{font-size:.98rem}
.hotel{padding:10px 14px;border-radius:14px;margin-bottom:12px;flex-wrap:nowrap}
.h-txt{font-size:.95rem}
.day-head{font-size:1.15rem;margin:4px 0 8px}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.toolbar .progress{margin:0}
.chip{padding:5px 11px}
.stop{padding:0;border-radius:16px;margin-bottom:10px;overflow:hidden}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hl{flex:1;min-width:0}
.time{font-size:.85rem}
.title{font-size:1.04rem}
.peek{font-size:.85rem;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.chev{color:var(--sub);font-size:.9rem;width:14px;text-align:center}
.body{display:none;padding:0 14px 12px}
.stop.open .body{display:block}
.stop.open .head{padding-bottom:6px}
.stop.sub{margin-left:22px;border:1.5px dashed var(--line);background:rgba(255,255,255,.35)}
.stop.sub .title{font-size:.95rem;font-weight:600}
.stop.sub .head{padding:9px 12px}
.stop.top{background:var(--card);border:2px solid #f0c75e}
.move{margin:4px 0 8px;font-size:.9rem;padding:7px 11px}
ul.notes{margin:4px 0 4px;font-size:.93rem}
.place{display:flex;gap:8px;align-items:center;margin-top:8px;padding-top:8px}
.p-main{flex:1;min-width:0}
.place .pn{font-size:.95rem}
.place .pd{font-size:.85rem;color:var(--sub)}
.place .addr{font-size:.75rem;opacity:.85;line-height:1.35}
.ibtns{display:flex;gap:5px;flex:none}
.ib{width:38px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:1.05rem;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;cursor:pointer;padding:0}
.ib.map{border-color:#bcd6ee}.ib.taxi{border-color:#f3d98a}
.cat-h{cursor:pointer;display:flex;align-items:center;gap:6px}
.cat-h i,.sec-h i{font-style:normal;color:var(--sub);font-size:.8rem;margin-left:auto;font-weight:400}
.sec-h{display:flex;align-items:center;gap:6px}
.done-h{cursor:pointer}
.ci{padding:10px 12px}
.tip{font-size:.85rem;padding:10px 14px;text-align:center}

/* ---- v4 headline ---- */
.hline{display:flex;align-items:center;gap:8px;margin-top:4px}
.hline+.hline{margin-top:6px}
.kind{flex:none;font-size:.74rem;font-weight:800;border-radius:7px;padding:2px 8px;min-width:46px;text-align:center;background:#eee;color:#555}
.k-move{background:#e3efdc;color:#4f6b43}
.k-food{background:#fde3d9;color:#c2553c}
.k-see{background:#efe4f7;color:#7a4c99}
.k-shop{background:#efe4f7;color:#7a4c99}
.k-walk{background:#dff2ef;color:#2f7a6e}
.k-stay{background:#f6ecd2;color:#8a6a1f}
.k-train{background:#3b6a96;color:#fff}
.k-alert{background:#ffe48a;color:#7a5a00}
.htxt{font-weight:800;font-size:1.05rem;line-height:1.35}
.time{font-size:.8rem;opacity:.9}
.stop.sub .htxt{font-size:.93rem;font-weight:700}
.stop.sub .kind{opacity:.85}
.memo{font-size:.85rem;color:var(--sub);margin:2px 0 6px}
.stop.done .htxt{text-decoration:line-through;text-decoration-color:var(--done)}
.nd{font-weight:500;color:var(--sub);font-size:.9em}
.stop.done .nd{text-decoration:none}
.stop.top{border:1px solid var(--line)!important;background:var(--card)!important}
.st{display:inline-block;font-size:.7rem;font-weight:700;border-radius:6px;padding:0 6px;margin-left:4px;vertical-align:1px}
.st-ok{background:#e3efdc;color:#4f6b43}
.st-maybe{background:#eee;color:#888}
.alt-h{margin-top:14px;padding-top:10px;border-top:2px dashed var(--line);font-weight:700;font-size:.9rem;color:var(--sub)}
.sync{display:inline-block;margin-top:6px;font-size:.8rem;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 9px}
.sync.ok{color:#4f6b43;background:#e3efdc;border-color:#cfe2c4}
.wx{background:linear-gradient(135deg,#eaf3fb,#fffdf8);border:1px solid #d6e6f3;border-radius:16px;padding:12px 14px;margin-bottom:14px}
.wx-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:1.05rem}
.wxc{border:1px solid #cfe0ef;background:#fff;border-radius:8px;padding:2px 8px;font-size:.78rem;margin-left:4px;color:#3b6a96;font-family:inherit;cursor:pointer}
.wxc.on{background:#3b6a96;color:#fff;border-color:#3b6a96}
.wx-sub,.wx-msg{font-size:.85rem;color:var(--sub);margin-top:2px}
.wx-day{font-size:.88rem;margin-top:6px;font-weight:600}
.wx-strip{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.wx-h{flex:none;width:52px;text-align:center;background:#fff;border:1px solid #e3edf6;border-radius:10px;padding:5px 0;font-size:.78rem;color:var(--sub)}
.wx-h .e{font-size:1.2rem;line-height:1.4}
.wx-h .t{font-weight:800;color:var(--ink);font-size:.95rem}
.wx-h .p.hi{color:#2c6fb3;font-weight:700}
.wx-warn{margin-top:8px;font-size:.88rem;font-weight:700;color:#2c6fb3}
</style>
</head>
<body>
<header>
  <h1>🍜 후쿠오카 여행 일정</h1>
  <div class="subtitle">2026.11.21(토) ~ 11.23(월·공휴일) · 하카타 · 텐진 · 유후인</div>
  <div class="sync" id="sync">📱 체크는 이 폰에만 저장 중</div>
</header>

<div class="sticky"><div class="sticky-in">
  <div class="search">🔍<input id="q" type="search" placeholder="장소·가게·주소 검색 (예: 치이카와, 라멘, 락커)" autocomplete="off"><button id="clear" aria-label="지우기">✕</button></div>
  <div class="tabs" id="tabs"></div>
</div></div>

<main id="main"></main>

<div id="overlay">
  <div id="ov-ask">ここへ行ってください 🙏</div>
  <div id="ov-name"></div>
  <div id="ov-addr"></div>
  <button class="btn" id="ov-close">닫기</button>
</div>
<div class="toast" id="toast"></div>

<script>
const HOTEL = {name:"スマイルスマートイン博多", ko:"스마일 스마트 인 하카타", addr:"福岡県福岡市博多区神屋町3-5"};

const DAYS = [
 {id:"day1", date:"2026-11-21", label:"1일차", sub:"11/21 토",
  title:"하카타 · 나카스 · 텐진 핵심 쇼핑 데이",
  stops:[

    notes:["첫차는 문성초 04:25 출발 → 말미고개 04:30쯤 통과","요금 17,000원 · T2는 T1 다음에 내려요","T2 도착 05:40~05:50 예상 → 빠듯하니 진에어 모바일 체크인 미리!","여권 챙기기"],
    places:[{n:"말미고개 (금천소방서) - 6004번 정류장", ja:"말미고개 금천소방서", a:"말미고개 금천소방서 버스정류장"}]},
   {time:"06:55 ~ 08:15", top:true, title:"출국 비행기 LJ421",
    move:"✈️ 인천 06:55 → 후쿠오카 08:15 (진에어 LJ421)",
    notes:[], places:[]},
   {time:"08:15 ~ 10:00", tag:"메인", title:"공항 → 하카타역 이동 & 코인락커 보관",
    move:"🚐 국제선 1층 1번 승강장 무료 셔틀 → 국내선 남쪽 하차 → 🚇 후쿠오카공항역 → 하카타역 (5분 / 260엔) · 총 약 25분",
    notes:["① 입국 후 1층 도착 로비 밖 1번 승강장 '国内線行き 連絡バス' (무료 · 5~8분 간격 · 10~15분)","② 종점(국내선 남쪽)에서 내려 지하철 표지판 따라 후쿠오카공항역","③ 공항선 2정거장 → 하카타역 (교통카드·컨택리스 카드 OK)","대안: 국제선 2번 승강장 니시테츠 버스로 하카타역 직행 (약 25분)","하카타구치 1층 코인락커 (대형 700~800엔)"],

   {time:"10:00 ~ 12:15", tag:"메인", title:"점심 오픈런 — 키와미야 함바그 하카타점",
    notes:["10:30경 대기 → 11:00 오픈 입장 (평일 점심엔 2시간 대기도 있음)","13:10 커비 카페 전까지 여유롭게 식사"],
    places:[{n:"키와미야 (하카타점) - 함바그 · 버스터미널 1층 외부", ja:"極味や 博多店", a:"福岡県福岡市博多区博多駅中央街2-1"}]},
   {time:"10:00 ~ 10:30", tag:"서브 · 시간 여유 시", sub:true, title:"오픈 직후 ~ 줄 서기 전 틈새 쇼핑",
    notes:[],

     {n:"포켓몬센터 (후쿠오카) - KITTE 2F", ja:"ポケモンセンターフクオカ", a:"福岡県福岡市博多区博多駅中央街9-1 KITTE博多 2F", d:"10:00~21:00 · 博多マルイ 2F · 후쿠오카 한정 굿즈"},
     {n:"드림캡슐 (하카타마루이점) - 가챠샵 · KITTE 6F", ja:"ドリームカプセル 博多マルイ店", a:"福岡県福岡市博多区博多駅中央街9-1 KITTE博多 6F", d:"博多マルイ 영업시간(10:00~21:00) 기준 · 신상 가챠"}

   {time:"12:15 ~ 14:30", tag:"메인", title:"⏰ 13:10 커비 카페 하카타 (예약 확정)",
    move:"🚶‍♀️ 하카타역 → 캐널시티 도보 10~12분 (850m)",
    notes:[],
    places:[{n:"커비 카페 (하카타) - 캐널시티 사우스빌딩 B1F", ja:"カービィカフェ博多 キャナルシティ博多", a:"福岡県福岡市博多区住吉1-2"}]},
   {time:"12:15 ~ 14:30", tag:"서브 · 선택", sub:true, title:"커비 카페 전후 & 숙소 가는 길",
    notes:["숙소 가는 길목 쿠시다 신사 & 카와바타 상점가 잠깐 구경"],

   {time:"14:30 ~ 15:30", tag:"메인", title:"캐리어 수령 → 숙소 체크인",
    move:"🚶‍♀️ 캐널시티 → 하카타역 도보 10분 → 짐 찾고 숙소까지 도보 10~12분 (무거우면 택시 700~800엔)",

function todayId(){
  const t=new Date(); const s=t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");
  const d=DAYS.find(x=>x.date===s); return d?d.id:null;
}

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text,q){
  const e=esc(text); if(!q) return e;
  const re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return e.replace(re,"<mark>$1</mark>");
}

let openSet=new Set(); let closedCats=new Set(["__done"]);
function fmt(t,q){ const i=t.indexOf(" - "); return i<0? hl(t,q) : hl(t.slice(0,i),q)+`<span class="nd"> - ${hl(t.slice(i+3),q)}</span>`; }
function placeHTML(p,q){
  return `<div class="place">
    <div class="p-main">
      <div class="pn">${fmt(p.n,q)}</div>
      ${p.d?`<div class="pd">${hl(p.d,q)}</div>`:""}
      <div class="addr">${hl(p.a,q)}</div>
    </div>
    <div class="ibtns">
      <a class="ib map" href="${mapUrl(p)}" target="_blank" rel="noopener" aria-label="지도">🗺️</a>
      <button class="ib" data-copy="${esc(p.a)}" aria-label="주소 복사">📋</button>
      <button class="ib taxi" data-taxi-n="${esc(p.ja||p.n)}" data-taxi-a="${esc(p.a)}" aria-label="택시용 크게 보기">🚕</button>
    </div></div>`;
}
function stopHTML(s,key,q,dayLabel){
  const isDone=!!done[key];
  const open = q || openSet.has(key);
  const cnt = s.places.length;
  const peek = s.move ? s.move.split("·")[0].replace(/^[^\s]+\s/,"") : (cnt? s.places.map(p=>p.n.replace(/\(.*?\)/g,"").trim()).slice(0,2).join(" · ") : "");
  return `<div class="stop ${s.top?"top":""} ${s.sub?"sub":""} ${isDone?"done":""} ${open?"open":""}">
    <div class="head" data-toggle="${key}">
      <div class="hl">
        <div class="time">${dayLabel?`<span class="result-day">${dayLabel}</span>`:""}${esc(s.time)}${s.st==="후보"?` <span class="st st-maybe">후보</span>`:""}</div>
        ${s.heads.map(([k,t])=>`<div class="hline">${k?`<span class="kind ${KIND[k]||""}">${esc(k)}</span>`:""}<span class="htxt">${fmt(t,q)}</span></div>`).join("")}
      </div>
      <button class="chk" data-key="${key}" aria-label="완료">${isDone?"✓":""}</button>
      <span class="chev">${open?"▴":"▾"}</span>
    </div>
    <div class="body">
      ${s.move?`<div class="move">${hl(s.move,q)}</div>`:""}
      ${s.notes.length?`<ul class="notes">${s.notes.map(n=>`<li>${hl(n,q)}</li>`).join("")}</ul>`:""}
      ${s.places.map(p=>placeHTML(p,q)).join("")}
      ${s.alts?`<div class="alt-h">🔄 못 가면 근처 대안</div>`+s.alts.map(p=>placeHTML(p,q)).join(""):""}
    </div>
  </div>`;
}

  return `<div class="ci ${v?"v":""}">

function checkHTML(){
  const all=CHECK.flatMap(c=>c.items); const n=all.filter(i=>visited[i.id]).length;
  const pct=Math.round(n/all.length*100);
  let h=`<div class="day-head">✅ 가고 싶은 곳 체크리스트</div>
   <div class="bar"><div style="width:${pct}%"></div></div>
   <div class="progress">다녀온 곳 ${n} / ${all.length} · 묶음 제목을 누르면 접혀요</div>
   <div class="sec-h">🔜 아직 못 간 곳</div>`;
  let left=0;
  CHECK.forEach(c=>{
    const rest=c.items.filter(i=>!visited[i.id]); left+=rest.length;
    if(rest.length){ const cl=closedCats.has(c.cat); h+=`<div class="cat-h" data-cat="${esc(c.cat)}">${c.cat} <span>${rest.length}</span><i>${cl?"▾":"▴"}</i></div>`+(cl?"":rest.map(i=>checkItemHTML(i,c.cat)).join("")); }
  });
  if(!left) h+=`<div class="empty">🎉 전부 다녀왔어요!</div>`;
  const doneList=[]; CHECK.forEach(c=>c.items.forEach(i=>{ if(visited[i.id]) doneList.push([visited[i.id],checkItemHTML(i,c.cat)]); }));
  doneList.sort((a,b)=>b[0]-a[0]);
  const dc=closedCats.has("__done");
  h+=`<div class="sec-h done-h" data-cat="__done">✔️ 다녀온 곳 ${doneList.length} <i>${dc?"▾ 펼치기":"▴ 접기"}</i></div>` + (dc?"":(doneList.map(x=>x[1]).join("")||`<div class="empty" style="padding:16px 0">아직 없어요 · 다녀오면 체크!</div>`));

  return h;
}

const WXLOC={fukuoka:{name:"후쿠오카",lat:33.59,lon:130.40},yufuin:{name:"유후인",lat:33.265,lon:131.36}};

const WXC=c=>c===0?["☀️","맑음"]:c<=2?["🌤️","구름 조금"]:c===3?["☁️","흐림"]:c<=48?["🌫️","안개"]:c<=57?["🌦️","이슬비"]:c<=67?["🌧️","비"]:c<=77?["🌨️","눈"]:c<=82?["🌧️","소나기"]:c<=86?["🌨️","눈 소나기"]:["⛈️","뇌우"];
async function loadWx(){
  for(const [k,l] of Object.entries(WXLOC)){
    try{
      const u=`https://api.open-meteo.com/v1/forecast?latitude=${l.lat}&longitude=${l.lon}&current=temperature_2m,apparent_temperature,weather_code,precipitation&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FTokyo&forecast_days=7`;
      const r=await fetch(u); if(!r.ok) throw 0; const j=await r.json(); j.fetched=Date.now(); wx[k]=j;
    }catch(e){}
  }
  store.set("fk-wx",wx); if(!$("#q").value && current!=="check") render();
}
function wxHTML(d){
  const key=wxPick[d.id]||DAYLOC[d.id]; const w=wx[key]; const L=WXLOC[key];
  const chips=Object.entries(WXLOC).map(([k,l])=>`<button class="wxc ${k===key?"on":""}" data-wx="${d.id}|${k}">${l.name}</button>`).join("");
  if(!w||!w.hourly) return `<div class="wx"><div class="wx-top"><b>🌡️ 날씨</b><span>${chips}</span></div><div class="wx-msg">날씨를 불러오는 중이에요… (인터넷 연결 필요)</div></div>`;
  const nowT=w.current.time; const today=nowT.slice(0,10);
  const H=w.hourly.time.map((t,i)=>({t,tp:Math.round(w.hourly.temperature_2m[i]),p:w.hourly.precipitation_probability[i]??0,c:w.hourly.weather_code[i]}));
  let hrs; const isToday=d.date===today;
  if(isToday){ const i0=H.findIndex(x=>x.t>=nowT.slice(0,13)+":00"); hrs=H.slice(Math.max(0,i0),i0+12); }
  else hrs=H.filter(x=>x.t.startsWith(d.date)&&+x.t.slice(11,13)>=6);
  const di=w.daily.time.indexOf(d.date);
  const day=di>=0?`<div class="wx-day">${d.sub} ${WXC(w.daily.weather_code[di])[0]} 최저 ${Math.round(w.daily.temperature_2m_min[di])}° / 최고 ${Math.round(w.daily.temperature_2m_max[di])}° · 비 확률 최대 ${w.daily.precipitation_probability_max[di]??0}%</div>`:"";
  const cur=WXC(w.current.weather_code);
  const rain=hrs.some(x=>x.p>=50)?`<div class="wx-warn">☔ 비 올 확률이 높은 시간이 있어요 → 우산 챙기기!</div>`:"";
  const age=Math.round((Date.now()-(w.fetched||0))/60000);
  return `<div class="wx">
    <div class="wx-top"><b>${cur[0]} ${L.name} 지금 ${Math.round(w.current.temperature_2m)}°</b><span>${chips}</span></div>
    <div class="wx-sub">${cur[1]} · 체감 ${Math.round(w.current.apparent_temperature)}° · ${age<2?"방금":age+"분 전"} 업데이트</div>
    ${day}
    ${hrs.length?`<div class="wx-strip">${hrs.map(x=>`<div class="wx-h"><div>${+x.t.slice(11,13)}시</div><div class="e">${WXC(x.c)[0]}</div><div class="t">${x.tp}°</div><div class="p ${x.p>=40?"hi":""}">💧${x.p}%</div></div>`).join("")}</div>`:`<div class="wx-msg">이 날짜 예보는 아직 안 나왔어요</div>`}
    ${rain}
  </div>`;
}
loadWx(); setInterval(loadWx,30*60*1000);
function render(){
  renderTabs();
  const q=$("#q").value.trim();
  let html="";
  if(q){
    const ql=q.toLowerCase(); let hits=[];
    DAYS.forEach(d=>d.stops.forEach((s,i)=>{
      const blob=[...s.heads.flat(),...(s.alts||[]).flatMap(p=>[p.n,p.d||""]),s.title,s.move||"",...s.notes,...s.places.flatMap(p=>[p.n,p.a,p.d||"",p.ja||""])].join(" ").toLowerCase();
      if(blob.includes(ql)) hits.push(stopHTML(s,d.id+"-"+i,q,d.label));
    }));
    html = `<div class="progress">"${esc(q)}" 검색 결과 ${hits.length}개</div>` + (hits.join("")||`<div class="empty">찾는 게 없어요 🥲<br>다른 단어로 검색해 보세요</div>`);
  } else if(current==="check"){
    html = checkHTML();
  } else {
    const d=DAYS.find(x=>x.id===current);
    const mains=d.stops.map((s,i)=>[s,i]).filter(([s])=>!s.sub); const total=mains.length, n=mains.filter(([s,i])=>done[d.id+"-"+i]).length;
    const allOpen=d.stops.every((s,i)=>(mainOnly&&s.sub)||openSet.has(d.id+"-"+i));
    html = hotelHTML() + wxHTML(d) + `
      <div class="toolbar"><span class="progress">${n}/${total} 완료</span>
      <span><button class="chip" id="mo">${mainOnly?"서브 보기":"메인만"}</button>
      <button class="chip" id="ea" data-day="${d.id}">${allOpen?"모두 접기":"모두 펼치기"}</button></span></div>`
      + d.stops.map((s,i)=>(mainOnly&&s.sub)?"":stopHTML(s,d.id+"-"+i,"")).join("")
      + `<div class="tip">카드를 누르면 펼쳐져요 · 🗺️ 지도 · 📋 주소 복사 · 🚕 택시 기사님께 보여주기</div>`;
  }
  $("#main").innerHTML=html;
}

// ---------- events ----------
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1500);}
document.addEventListener("click",async e=>{
  const c=e.target.closest("[data-copy]");
  if(c){ try{await navigator.clipboard.writeText(c.dataset.copy);toast("주소 복사됨 ✓");}catch(err){toast("복사가 막혔어요 — 주소를 길게 눌러 복사하세요");} return; }
  const t=e.target.closest("[data-taxi-a]");
  if(t){ $("#ov-name").textContent=t.dataset.taxiN; $("#ov-addr").textContent=t.dataset.taxiA; $("#overlay").classList.add("on"); return; }
  const wb=e.target.closest("[data-wx]");
  if(wb){ const [dd,k]=wb.dataset.wx.split("|"); wxPick[dd]=k; render(); return; }
  const ea=e.target.closest("#ea");
  if(ea){ const d=DAYS.find(x=>x.id===ea.dataset.day); const keys=d.stops.map((s,i)=>d.id+"-"+i);
    const all=keys.every((k,i)=>(mainOnly&&d.stops[i].sub)||openSet.has(k)); keys.forEach(k=>all?openSet.delete(k):openSet.add(k)); render(); return; }
  const tg=e.target.closest("[data-toggle]");
  if(tg && !e.target.closest(".chk")){ const k=tg.dataset.toggle; openSet.has(k)?openSet.delete(k):openSet.add(k); render(); return; }
  const ch=e.target.closest("[data-cat]");
  if(ch){ const c=ch.dataset.cat; closedCats.has(c)?closedCats.delete(c):closedCats.add(c); render(); return; }
  if(e.target.closest("#mo")){ mainOnly=!mainOnly; store.set("fk-mainonly",mainOnly); render(); return; }
  const v=e.target.closest(".vchk");
  if(v){ const id=v.dataset.vid; if(visited[id]) delete visited[id]; else visited[id]=Date.now(); store.set("fk-visited",visited); window.fkPush&&fkPush("visited",id,visited[id]||null); render(); if(visited[id]) toast("다녀온 곳으로 옮겼어요 ✓"); return; }
  const k=e.target.closest(".chk");
  if(k){ const key=k.dataset.key; if(done[key]) delete done[key]; else done[key]=1; store.set("fk-done",done); window.fkPush&&fkPush("done",key,done[key]||null); render(); return; }
});
$("#ov-close").onclick=()=>$("#overlay").classList.remove("on");
$("#q").addEventListener("input",()=>{ $("#clear").style.display=$("#q").value?"block":"none"; render(); });
$("#clear").onclick=()=>{ $("#q").value=""; $("#clear").style.display="none"; render(); $("#q").focus(); };
window.addEventListener("hashchange",()=>{ const h=location.hash.slice(1); if(validView(h)){current=h;render();} });
window.fkApply=function(data){
  done=(data&&data.done)||{}; visited=(data&&data.visited)||{};
  store.set("fk-done",done); store.set("fk-visited",visited); render();
};
window.fkLocal=function(){ return {done:done, visited:visited}; };
render();
</script>
<script type="module">
// ===== 체크 공유 (Firebase Firestore) =====
// 아래 설정값만 채우면 엄마 폰·보미 폰 체크가 실시간으로 같이 보여요.
const firebaseConfig = null; /*__FIREBASE_CONFIG__*/
const syncEl=document.getElementById("sync");
const setSync=(t,ok)=>{ if(syncEl){ syncEl.textContent=t; syncEl.className="sync"+(ok?" ok":""); } };
if(firebaseConfig){
  try{
    const V="10.12.2";
    const {initializeApp}=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
    const fs=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
    const app=initializeApp(firebaseConfig);
    const db=fs.getFirestore(app);
    const ref=fs.doc(db,"trips","fukuoka-2026-11");
    setSync("☁️ 연결 중…",false);
    let first=true;
    fs.onSnapshot(ref,(snap)=>{
      if(!snap.exists()){
        fs.setDoc(ref,window.fkLocal()).catch(()=>setSync("⚠️ 저장 실패 · 이 폰에만 저장 중",false));
      }else{
        const d=snap.data();
        if(first){ // 처음 연결할 때 이 폰에만 있던 체크도 합치기
          const loc=window.fkLocal(); const merged={done:{...loc.done,...(d.done||{})},visited:{...loc.visited,...(d.visited||{})}};
          window.fkApply(merged);
          if(JSON.stringify(merged)!==JSON.stringify({done:d.done||{},visited:d.visited||{}})) fs.setDoc(ref,merged,{merge:true});
        }else window.fkApply(d);
      }
      first=false;
      setSync("☁️ 체크가 엄마 폰과 같이 저장돼요",true);
    },()=>setSync("⚠️ 연결 실패 · 이 폰에만 저장 중",false));
    window.fkPush=(kind,key,val)=>{
      const fp=new fs.FieldPath(kind,key);
      fs.updateDoc(ref,fp,val===null?fs.deleteField():val).catch(()=>setSync("⚠️ 저장 실패 · 인터넷 확인",false));
    };
  }catch(e){ setSync("⚠️ 연결 실패 · 이 폰에만 저장 중",false); }
}
</script>
